<script>
/* ====================== KONFIGURASI ====================== */
/* Terhubung langsung ke spreadsheet aslinya via Google Sheets API v4 */
const SPREADSHEET_ID = "1KlWD9pye4vqIsxO6sv5XfyfO-e4CCSS6tcKqiP1DjY0";
const API_KEY = "AIzaSyBRNBQxfptX2-BF1gJ3eqVNMFi8ne63Qv0";
const SHEETS = ["RESULT", "DATA PENTING", "BOLAA"];
// Sheet yang tampilannya berupa blok topik (label + paragraf), dirender seperti BOLAA
const DOCUMENT_SHEETS = new Set(["DATA PENTING", "BOLAA"]);
// Sheet yang datanya dibatasi hanya kolom tertentu (mis. RESULT cuma kolom A-C)
const SHEET_RANGES = { "RESULT": "A8:C" };
const AUTO_REFRESH_MINUTES = 5;
/* =========================================================== */

const state = {}; // { sheetName: { headers:[], rows:[[]], filtered:[], sortCol:null, sortDir:1, query:'' } }
let activeSheet = SHEETS[0];

const DIVIDER = "border-b-[3px] border-[#193c66] last:border-b-0";

function sheetsApiUrl(sheetName){
  const range = SHEET_RANGES[sheetName] ? `${encodeURIComponent(sheetName)}!${SHEET_RANGES[sheetName]}` : encodeURIComponent(sheetName);
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${range}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING&key=${API_KEY}`;
}

/* ---------- Parsing respons Google Sheets API v4 ---------- */
function parseSheetsApiResponse(json){
  const values = json.values || [];
  if(values.length === 0) return { headers: [], rows: [], allRows: [] };

  const headerRow = values[0];
  const bodyRows = values.slice(1);
  const colCount = headerRow.length;

  const headers = headerRow.map((h, i) => (h && String(h).trim()) || `Kolom ${i + 1}`);

  const rows = bodyRows.map(row => {
    const padded = row.slice(0, colCount);
    while(padded.length < colCount) padded.push("");
    return padded;
  });

  return { headers, rows, allRows: values };
}

async function fetchSheet(sheetName){
  const res = await fetch(sheetsApiUrl(sheetName));
  if(!res.ok){
    let detail = res.status;
    try{
      const errJson = await res.json();
      detail = errJson?.error?.message || detail;
    }catch(_){ /* abaikan, pakai status code */ }
    throw new Error(`Gagal ambil sheet "${sheetName}": ${detail}`);
  }
  const json = await res.json();
  return parseSheetsApiResponse(json);
}

/* ---------- Deteksi sheet bertipe dokumen (blok topik, mis. BOLAA & DATA PENTING) ---------- */
function isFaqSheet(sheetName){
  return DOCUMENT_SHEETS.has(sheetName);
}

function prettyLabel(label){
  if(label === label.toUpperCase()){
    return label.toLowerCase().replace(/(^|\s|\/)\S/g, c => c.toUpperCase());
  }
  return label;
}

function buildFaqBlocks(allRows){
  const rawBlocks = [];
  let current = null;
  let inPreamble = true;
  const pushCurrent = () => {
    if(current){
      while(current.rows.length && current.rows[0] === null) current.rows.shift();
      while(current.rows.length && current.rows[current.rows.length - 1] === null) current.rows.pop();
      rawBlocks.push(current);
      current = null;
    }
  };

  allRows.forEach(row => {
    const nonEmpty = row
      .map((c, i) => ({ i, v: String(c ?? "").trim() }))
      .filter(o => o.v !== "");
    if(nonEmpty.length === 0){
      if(current){
        current.rows.push(null);
      }else if(rawBlocks.length && rawBlocks[rawBlocks.length - 1].type !== "spacer"){
        rawBlocks.push({ type: "spacer" });
      }
      return;
    }

    const isLabelCol = nonEmpty[0].i === 0;
    const label = isLabelCol ? nonEmpty[0].v : "";
    const labelLower = label.toLowerCase();
    const restCells = isLabelCol ? nonEmpty.slice(1).map(o => o.v) : nonEmpty.map(o => o.v);

    if(label && restCells.length === 0 && label === label.toUpperCase() && /[A-Z]/.test(label)){
      pushCurrent();
      rawBlocks.push({ type: "title", text: label });
      return;
    }

    if(inPreamble && label && restCells.length === 1 && /^https?:\/\/\S+$/i.test(restCells[0])){
      rawBlocks.push({ type: "link", label, url: restCells[0] });
      return;
    }

    if(label){
      pushCurrent();
      inPreamble = false;
      const kind = labelLower.startsWith("pertanyaan") ? "question"
                 : labelLower.startsWith("contoh") ? "example"
                 : "topic";
      current = {
        type: kind,
        label: kind === "question" ? "Pertanyaan" : prettyLabel(label.replace(/:\s*$/, "")),
        rows: restCells.length ? [restCells] : []
      };
      return;
    }

    if(current && restCells.length){
      current.rows.push(restCells);
      return;
    }

    if(restCells.length){
      rawBlocks.push({ type: "note", text: restCells.join(" · ") });
    }
  });
  pushCurrent();

  while(rawBlocks.length && rawBlocks[0].type === "spacer") rawBlocks.shift();
  while(rawBlocks.length && rawBlocks[rawBlocks.length - 1].type === "spacer") rawBlocks.pop();

  const merged = [];
  let linkGroup = null;
  rawBlocks.forEach(b => {
    if(b.type === "link"){
      if(!linkGroup){ linkGroup = { type: "linkGroup", items: [] }; merged.push(linkGroup); }
      linkGroup.items.push({ label: b.label, url: b.url });
    }else{
      linkGroup = null;
      merged.push(b);
    }
  });
  return merged;
}

function linkify(escapedText){
  return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-[#7cc7ff] underline break-all hover:text-white">${url}</a>`
  );
}

const FAQ_TYPE_STYLE = {
  question: { accent: "border-l-[#4da8ff]", grad: "from-[#2f6fd6] to-[#123a75]" },
  topic:    { accent: "border-l-[#7ea9dd]", grad: "from-[#1c4a80] to-[#0b2247]" },
  example:  { accent: "border-l-[#c7d8ef]", grad: "from-[#4f6f9c] to-[#2a3f5f]" },
};

function renderFaqBlocks(blocks, query){
  const q = (query || "").toLowerCase();
  const rowsMatch = rows => !q || rows.some(cols => cols && cols.some(c => c.toLowerCase().includes(q)));

  return blocks.map(b => {
    if(b.type === "title"){
      if(q && !b.text.toLowerCase().includes(q)) return "";
      return `<div class="${DIVIDER}"><div class="text-center uppercase font-display font-extrabold text-[14px] tracking-[0.06em] text-brand-teal px-4 py-2.5">${escapeHtml(b.text)}</div></div>`;
    }

    if(b.type === "spacer"){
      return q ? "" : `<div class="h-[18px]"></div>`;
    }

    if(b.type === "linkGroup"){
      const items = b.items.filter(it => !q || it.label.toLowerCase().includes(q) || it.url.toLowerCase().includes(q));
      if(items.length === 0) return "";
      const rows = items.map(it => `
        <div class="flex items-center gap-3.5 flex-wrap px-3.5 py-2 border-b border-[#dce6f2] last:border-b-0">
          <span class="font-extrabold text-[#0b1c33] text-[12.5px] font-sans whitespace-nowrap min-w-[150px]">${escapeHtml(it.label)}</span>
          <a href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer" class="text-[#1560d6] font-mono text-[12.5px] underline break-all inline-flex items-center gap-1 hover:text-[#0b3d8a]">${escapeHtml(it.url)} ↗</a>
        </div>`).join("");
      return `<div class="${DIVIDER}"><div class="bg-white border border-[#dce6f2] rounded-lg overflow-hidden mb-1 shadow-[0_2px_10px_rgba(0,0,0,0.15)]">${rows}</div></div>`;
    }

    if(b.type === "note"){
      if(q && !b.text.toLowerCase().includes(q)) return "";
      return `<div class="${DIVIDER}"><div class="text-ink-muted text-[12px] px-3.5 py-1 leading-relaxed">${linkify(escapeHtml(b.text))}</div></div>`;
    }

    // question / topic (termasuk jawaban) / example -> kartu label + konten (mendukung kolom ganda)
    if(!rowsMatch(b.rows)) return "";
    const style = FAQ_TYPE_STYLE[b.type] || FAQ_TYPE_STYLE.topic;
    const contentHtml = b.rows.length
      ? b.rows.map(cols => cols === null
          ? `<div class="h-2.5"></div>`
          : `<div class="flex gap-5 flex-wrap">${cols.map(c => `<div class="flex-1 basis-[220px] min-w-[200px] text-brand-amber text-[13px] leading-tight ${b.type === 'question' ? 'font-semibold' : ''}">${linkify(escapeHtml(c))}</div>`).join("")}</div>`
        ).join("")
      : "";
    return `<div class="${DIVIDER}"><div class="flex items-stretch rounded-md overflow-hidden bg-[#0a1830] border-l-[3px] ${style.accent}">
      <div class="flex-none w-[130px] flex items-center justify-center text-center px-2.5 py-2.5 font-display font-extrabold text-[11.5px] tracking-[0.03em] text-white leading-[1.25] break-words bg-gradient-to-br ${style.grad}">${linkify(escapeHtml(b.label))}</div>
      ${contentHtml ? `<div class="flex-1 px-4 py-2 flex flex-col justify-center gap-1 min-w-0">${contentHtml}</div>` : ""}
    </div></div>`;
  }).join("");
}

/* ---------- UI: tabs ---------- */
function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  SHEETS.forEach(name => {
    const isActive = name === activeSheet;
    const tab = document.createElement("div");
    tab.className = "flex items-center gap-2 font-display font-bold text-[13.5px] tracking-wide px-4 py-[11px] cursor-pointer select-none border-b-[2.5px] transition-colors whitespace-nowrap "
      + (isActive ? "text-ink-text border-brand-amber" : "text-ink-muted border-transparent hover:text-ink-text");
    tab.dataset.sheet = name;
    const s = state[name];
    const count = s?.isFaq
      ? (s.faqBlocks?.filter(b => b.type === "question").length ?? "–")
      : (s?.rows?.length ?? "–");
    tab.innerHTML = `
      <span class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-brand-amber shadow-[0_0_8px_#4da8ff]' : 'bg-ink-dim'}"></span>
      ${name}
      <span class="font-mono text-[11px] text-ink-dim bg-ink-surface2 px-[6px] py-[1px] rounded-full">${count}</span>
    `;
    tab.addEventListener("click", () => switchTab(name));
    tabsEl.appendChild(tab);
  });
}

function switchTab(name){
  activeSheet = name;
  buildTabs();
  document.querySelectorAll(".panel").forEach(p => {
    const isActive = p.dataset.sheet === name;
    p.classList.toggle("hidden", !isActive);
    p.classList.toggle("flex", isActive);
    p.classList.toggle("flex-col", isActive);
    p.classList.toggle("animate-fadeUp", isActive);
  });
}

/* ---------- UI: panel per sheet ---------- */
function buildPanelShell(name){
  const isActive = name === activeSheet;
  const panel = document.createElement("div");
  panel.className = "h-full " + (isActive ? "flex flex-col animate-fadeUp" : "hidden");
  panel.dataset.sheet = name;
  panel.innerHTML = `
    <div class="flex-1 min-h-0 flex flex-col bg-ink-surface border border-ink-edge rounded-[10px] overflow-hidden shadow-[0_8px_30px_rgba(0,0,0,0.35)]">
      <div class="flex-1 min-h-0 overflow-auto themed-scroll" data-scroll="${name}">
        ${stateHtml("loading")}
      </div>
    </div>
  `;
  return panel;
}

function stateHtml(kind, message){
  if(kind === "loading"){
    return `<div class="flex flex-col items-center justify-center gap-3 py-[70px] px-5 text-ink-dim">
      <div class="w-[26px] h-[26px] rounded-full border-[3px] border-ink-edge border-t-brand-amber animate-spin"></div>
      Memuat data…
    </div>`;
  }
  if(kind === "error"){
    return `<div class="flex flex-col items-center justify-center gap-3 py-[70px] px-5 text-brand-red">${escapeHtml(message || "Terjadi kesalahan")}</div>`;
  }
  return `<div class="flex flex-col items-center justify-center gap-3 py-[70px] px-5 text-ink-dim">${escapeHtml(message || "Tidak ada data")}</div>`;
}

function renderTable(name){
  const s = state[name];
  const scrollEl = document.querySelector(`[data-scroll="${CSS.escape(name)}"]`);
  if(!s){
    scrollEl.innerHTML = stateHtml("error", "Data tidak tersedia");
    return;
  }

  if(s.isFaq){
    const html = renderFaqBlocks(s.faqBlocks, s.query);
    scrollEl.innerHTML = html.trim()
      ? `<div class="flex flex-col gap-0 p-3.5 bg-[#040c1c] rounded-lg">${html}</div>`
      : stateHtml("empty", "Tidak ada yang cocok");
    return;
  }

  if(!s.headers){
    scrollEl.innerHTML = stateHtml("error", "Data tidak tersedia");
    return;
  }
  const rows = s.filtered;

  if(rows.length === 0){
    scrollEl.innerHTML = stateHtml("empty", "Tidak ada data yang cocok");
    return;
  }

  const todayStr = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' }).replace(/\//g,'-');
  const dateColIdx = s.headers.findIndex(h => /tanggal|date|tgl/i.test(h));

  const blocks = [];
  let currentGroup = [];
  const flushGroup = () => {
    if(currentGroup.length === 0) return;
    const groupHasToday = currentGroup.some(r => r.isToday);
    const rowsHtml = currentGroup.map(({ filledCells, isToday }) => {
      const cols = filledCells.map(val => `<div class="flex-1 basis-[220px] min-w-[200px] text-brand-amber text-[13px] leading-tight">${linkify(formatCell(val))}</div>`).join("");
      return `<div class="flex items-center flex-wrap gap-5 px-4 ${isToday ? 'bg-[#123259] border-l-[3px] border-[#4da8ff]' : ''}">${cols}</div>`;
    }).join("");
    blocks.push(`<div class="${DIVIDER}"><div class="${groupHasToday ? 'bg-[#123259]' : 'bg-[#0a1830]'} py-2">${rowsHtml}</div></div>`);
    currentGroup = [];
  };

  rows.forEach(row => {
    let isToday = false;
    if(dateColIdx >= 0){
      const cellVal = String(row[dateColIdx] ?? "");
      if(cellVal.includes(todayStr) || cellVal === todayStr) isToday = true;
    }
    const filledCells = row.map(cell => String(cell ?? "").trim()).filter(v => v !== "");
    if(filledCells.length === 0){
      flushGroup();
      blocks.push(`<div class="h-[18px]"></div>`);
    } else {
      currentGroup.push({ filledCells, isToday });
    }
  });
  flushGroup();
  while(blocks.length && blocks[0].includes('h-[18px]')) blocks.shift();
  while(blocks.length && blocks[blocks.length - 1].includes('h-[18px]')) blocks.pop();

  const cardsHtml = blocks.join("");

  scrollEl.innerHTML = cardsHtml
    ? `<div class="flex flex-col gap-0 p-3.5 bg-[#040c1c] rounded-lg">${cardsHtml}</div>`
    : stateHtml("empty", "Tidak ada data yang cocok");
}

function formatCell(val){
  const str = escapeHtml(String(val ?? ""));
  const lower = str.toLowerCase();
  if(["menang","win","ya","yes","valid"].includes(lower))
    return `<span class="inline-block px-[9px] py-[2px] rounded-full text-[11px] font-semibold font-sans bg-[rgba(255,255,255,0.14)] text-white ring-1 ring-white/25">${str}</span>`;
  if(["kalah","lose","tidak","no","invalid"].includes(lower))
    return `<span class="inline-block px-[9px] py-[2px] rounded-full text-[11px] font-semibold font-sans bg-[rgba(255,122,144,0.14)] text-brand-red">${str}</span>`;
  return str;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------- Flip clock ---------- */
function renderFlapClock(){
  const now = new Date();
  const parts = [
    String(now.getDate()).padStart(2,'0'),
    String(now.getMonth()+1).padStart(2,'0'),
    String(now.getHours()).padStart(2,'0'),
    String(now.getMinutes()).padStart(2,'0'),
  ];
  const clock = document.getElementById("flap-clock");
  clock.innerHTML = "";
  const chars = (parts[0] + parts[1] + "·" + parts[2] + parts[3]).split("");
  chars.forEach(ch => {
    const div = document.createElement("div");
    if(ch === "·"){
      div.className = "w-3 h-[30px] flex items-center justify-center font-mono font-bold text-[15px] text-ink-dim";
      div.textContent = ch;
    }else{
      div.className = "w-6 h-[30px] rounded-[5px] bg-ink-surface2 border border-ink-edge font-mono font-bold text-[15px] text-brand-amber flex items-center justify-center relative overflow-hidden";
      div.innerHTML = `<span class="relative z-10">${ch}</span><span class="absolute left-0 right-0 top-1/2 h-px bg-black/40"></span>`;
    }
    clock.appendChild(div);
  });
  document.getElementById("last-update-label").textContent =
    now.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

/* ---------- Load semua sheet ---------- */
async function loadAll(){
  const btn = document.getElementById("refresh-btn");
  const icon = btn.querySelector(".refresh-icon");
  icon.classList.add("animate-spin");

  await Promise.all(SHEETS.map(async name => {
    try{
      const { headers, rows, allRows } = await fetchSheet(name);
      if(isFaqSheet(name)){
        state[name] = { isFaq: true, faqBlocks: buildFaqBlocks(allRows), rows: allRows, query: "" };
      }else{
        state[name] = { isFaq: false, headers, rows, filtered: rows.slice(), sortCol: null, sortDir: 1, query: "" };
      }
    }catch(err){
      console.error(`Gagal memuat sheet ${name}:`, err);
      state[name] = { headers:null, rows:[], filtered:[], error: err.message };
      const scrollEl = document.querySelector(`[data-scroll="${CSS.escape(name)}"]`);
      if(scrollEl){
        scrollEl.innerHTML = stateHtml("error", `Gagal memuat data (${err.message})`);
      }
    }
  }));

  buildTabs();
  SHEETS.forEach(name => { if(state[name].isFaq || state[name].headers) renderTable(name); });
  renderFlapClock();
  icon.classList.remove("animate-spin");
}

/* ---------- Init ---------- */
function init(){
  const panelsEl = document.getElementById("panels");
  SHEETS.forEach(name => panelsEl.appendChild(buildPanelShell(name)));
  buildTabs();

  document.getElementById("refresh-btn").addEventListener("click", loadAll);

  loadAll();
  setInterval(loadAll, AUTO_REFRESH_MINUTES * 60 * 1000);
  setInterval(renderFlapClock, 30 * 1000);
}

init();
</script>
